<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#145A32"/>
      <stop offset="100%" stop-color="#1F7A4D"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B3B24" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle circular badge -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <circle cx="256" cy="256" r="186" fill="rgba(255,255,255,0.04)"/>
  
  <!-- Pharmacy Cross with Medical Caduceus / Heartbeat Pulse -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="216" y="116" width="80" height="280" rx="24" fill="#FFFFFF"/>
    <!-- Horizontal Bar -->
    <rect x="116" y="216" width="280" height="80" rx="24" fill="#FFFFFF"/>
  </g>

  <!-- Inner Vibrant Green Cross Accent -->
  <rect x="230" y="130" width="52" height="252" rx="14" fill="url(#crossGrad)"/>
  <rect x="130" y="230" width="252" height="52" rx="14" fill="url(#crossGrad)"/>

  <!-- Center Pulse & Caduceus Star -->
  <circle cx="256" cy="256" r="32" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="22" fill="#1F7A4D"/>
  
  <!-- CI Flag Accent Badge at bottom right -->
  <g transform="translate(356, 356)">
    <circle cx="24" cy="24" r="32" fill="#FFFFFF" filter="url(#shadow)"/>
    <clipPath id="ciCircle">
      <circle cx="24" cy="24" r="26"/>
    </clipPath>
    <g clip-path="url(#ciCircle)">
      <!-- Orange / White / Green stripes of Côte d'Ivoire -->
      <rect x="-2" y="-2" width="18" height="52" fill="#FF8200"/>
      <rect x="16" y="-2" width="16" height="52" fill="#FFFFFF"/>
      <rect x="32" y="-2" width="20" height="52" fill="#009A44"/>
    </g>
    <circle cx="24" cy="24" r="26" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
  </g>

  <!-- 118 Badge on top left -->
  <g transform="translate(68, 68)">
    <rect x="0" y="0" width="88" height="42" rx="21" fill="#DC2626" filter="url(#shadow)"/>
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">118</text>
  </g>
</svg>
